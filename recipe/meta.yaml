{% set name = "solarwindpy" %}
{% set version = "0.5.0" %}
{% set python_min = "3.12" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/solarwindpy-{{ version }}.tar.gz
  sha256: e42cedec4f0abf0b6cd490d0be0226033e4967ebbff528bcf1d0efa8622441da

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=61
    - wheel
    - setuptools-scm
    - pip
  run:
    - python >={{ python_min }},<4
    - numpy >=1.26,<3.0
    - scipy >=1.16
    - pandas >=3,<4
    - numexpr >=2.8
    - bottleneck >=1.3
    - pytables >=3.9
    - matplotlib-base >=3.10
    - astropy-base >=8
    - numba >=0.59
    - tabulate >=0.9
    - docstring-inheritance >=3.0,<4

test:
  imports:
    - solarwindpy
    - solarwindpy.core
    - solarwindpy.plotting
    - solarwindpy.fitfunctions
    - solarwindpy.instabilities
    - solarwindpy.solar_activity
    - solarwindpy.tools
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/blalterman/SolarWindPy
  summary: Python package for solar wind data analysis.
  description: |
    SolarWindPy provides tools for analyzing in-situ solar wind measurements,
    including multi-species plasma analysis, magnetic field calculations,
    and plasma instability studies.
  dev_url: https://github.com/blalterman/SolarWindPy
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - blalterman
